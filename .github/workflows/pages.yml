name: Publish current main to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test static geometry
        run: npm test

      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Include unchanged historical demos for comparison
        run: |
          mkdir -p dist/versions
          cp reference/v6.6/Wuffwerker-PixiJS-Rutenhaltung-v6.6.html dist/versions/v6.6.html
          cp reference/v7.5.1/Wuffwerker-Rumpf-v7.5.1-Biomechanik.html dist/versions/v7.5.1.html
          cp reference/v8.0.3/Wuffwerker-Kopf-Natuerliche-Haltung-v8.0.3.html dist/versions/v8.0.3.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
