name: Check Wuffwerker changes

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test geometry and motion
        run: npm test
      - name: Build Vite for Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
